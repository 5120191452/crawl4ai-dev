[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-ark-mcp"
version = "0.1.0"
description = "Read-only MCP server for discovering and selecting Orion Ark APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
orion-ark-mcp = "orion_ark_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orion_ark_mcp = ["scenarios.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
